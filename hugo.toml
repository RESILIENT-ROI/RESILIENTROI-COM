baseURL = 'https://resilientroi.com/'
languageCode = 'en-gb'
title = 'Resilient ROI'
theme = 'hugo-profile'
copyright = '&copy; Resilient ROI Ltd. | London, UK'

[outputs]
  home = ['HTML', 'RSS', 'JSON']
  page = ['HTML', 'RSS']

[markup.goldmark.renderer]
  unsafe = true

[[menu.main]]
  name = 'DBJ Method'
  url = 'https://method.dbj.org/'
  weight = 1

[[menu.main]]
  name = 'Guide'
  url = 'https://guide.dbj.org/'
  weight = 2

[[menu.main]]
  name = 'Iceberg'
  url = 'https://iceberg.dbj.org/'
  weight = 3

[params]
  title = 'Resilient ROI'
  description = 'AI Aligned Production Systems'
  favicon = '/favicon/favicon.ico'
  useBootstrapCDN = false
  animate = true

  # Apple-style neutrals with a single blue accent; every text colour clears 4.5:1 on its background.
  [params.color]
    textColor = '#1d1d1f'
    secondaryTextColor = '#6e6e73'
    textLinkColor = '#0066cc'
    backgroundColor = '#ffffff'
    primaryColor = '#0066cc'
    secondaryColor = '#f5f5f7'
    [params.color.darkmode]
      textColor = '#f5f5f7'
      secondaryTextColor = '#a1a1a6'
      textLinkColor = '#2997ff'
      backgroundColor = '#000000'
      primaryColor = '#2997ff'
      secondaryColor = '#1d1d1f'

  [params.font]
    fontSize = '1rem'
    fontWeight = 400
    lineHeight = 1.5
    textAlign = 'left'

  [params.navbar]
    align = 'ms-auto'
    brandLogo = '/logo-rroi-64.png'
    brandName = 'Resilient ROI'
    disableSearch = true
    enableSeparator = false
    [params.navbar.stickyNavBar]
      enable = true
      showOnScrollUp = true
    [params.navbar.menus]
      disableAbout = true
      disableExperience = true
      disableEducation = true
      disableProjects = false
      disableAchievements = true
      disableContact = false

  [params.hero]
    enable = true
    title = 'Resilient ROI.'
    titleSecond = 'Solving the legacy in the age of AI.'
    content = '''Work is measured by what it returns. Your old systems hold years of business knowledge. We help your teams keep it safe and carry it into the AI Arena.'''
    image = '/lady_architect_whiteboard.webp'
    imageAlt = 'Black-and-white image of an architect in a boardroom, pointing at a screen that reads: Do this, for this reason, and here is the price of getting it wrong.'
    [params.hero.button]
      enable = true
      name = 'What we do'
      url = '#projects'
      newPage = false
    [params.hero.secondaryLink]
      name = 'Write to us'
      url = '#contact'
    [params.hero.bottomImage]
      enable = false

  [params.projects]
    enable = true
    title = 'We Navigate'
    [[params.projects.items]]
      title = 'Enablement'
      content = '''Raising your crew's maturity, from boarding to following the operating model. The result is a steady stream of AI-enabled products or services, all resilient, safe and compliant.'''
      [params.projects.items.featured]
        name = 'The DBJ Method'
        link = 'https://method.dbj.org/'
    [[params.projects.items]]
      title = 'Preservation'
      content = 'Every mature organisation reaches the point where the business value it encapsulates is worth more than the software it has built or uses. Your old systems hold years of business knowledge. We enable your teams to take it out and keep it safe before anything is replaced, so modernisation does not throw it away with the old code.'
      [params.projects.items.featured]
        name = 'Technical debt on Iceberg'
        link = 'https://iceberg.dbj.org/kb/technical-debt/'
    [[params.projects.items]]
      title = 'Building'
      content = 'For architecture practices developing a method based on ours. Only the parts of the DBJ Method they need, one chapter at a time. We encapsulated TOGAF so that any role distant from architecture sees benefits, not confusion.'
      [params.projects.items.featured]
        name = 'The Guide'
        link = 'https://guide.dbj.org/'
    [[params.projects.items]]
      title = 'Onboarding'
      content = '''An organisation's key performance indicator is the sum of its people's capabilities and maturity. That is the key for adopters to enter the new operating model and mitigate the risks of the AI storm. They learn to decide where their organisation stands today, and what it takes to reach the organisation level, where work at AI speed can safely start. The ROI follows.'''
      [params.projects.items.featured]
        name = 'The maturity model'
        link = 'https://method.dbj.org/cmm/index.html'

  # Founder quote, shown as its own panel after the services (layouts/partials/sections/quote.html).
  [params.quote]
    title = 'State of the Industry'
    text = 'Most customers suffer the technical debt. And they quickly spot where Resilient ROI earn their money. Not by demanding poor engineers to clear every debt first, but by telling business leaders which debts they can live with, and for how long, which one kills the AI investment, and what it will actually cost to service the rest of the company landscape.'
    author = 'Dusan Jovanovic'
    role = 'EA, Founder'
    image = '/iceberg-grey.webp'
    imageAlt = '''Cartoon iceberg. Above the waterline: AI strategy, with a boat whose crew says "AI will transform us!" and "Let's move fast!". Below it: legacy systems, data pipelines, integration debt and no documentation, with a second boat saying "We're still fixing the foundation..." and a submarine at the base.'''

  [params.contact]
    enable = true
    title = 'Contact'
    content = 'AI does not wait. Write to us.'
    btnName = 'Email'
    btnLink = 'mailto:info@resilientroi.com'

  [params.footer]
    [params.footer.recentPosts]
      enable = false
      path = 'posts'
      count = 3
      title = 'Recent Posts'

  [params.about]
    enable = false
    title = 'We Navigate'
    content = """
The [DBJ Method](https://method.dbj.org/) is not the book of magic.

- **One shared vocabulary**: business, product and technology people speak one language. ([Taxonomy](https://method.dbj.org/taxonomy/index.html))
- **Business declares, technology implements**: Products teams is balancing the race. Business initiates ; technology never surprises. ([Operating model](https://method.dbj.org/bpt/bpt_operating_model.html))
- **Maturity is measured**: Achieved and maintained, before and after the delivery. ([Maturity model](https://method.dbj.org/cmm/index.html))
- **Every decision is recorded**: No ceremony. Short, repeatable cycles, and the reason for each decision. ([The wheel](https://method.dbj.org/adm/index.html))
- **Three quality factors**: Scalability, resilience and compliance. ([3QF](https://dbj.org/3qf-the-key-to-roi/))
- **Human-led**: Architecture decides the structure, flow and boundaries. AI speeds up the delivery.
"""
    [params.about.skills]
      enable = true
      content='With us, no project floats outside the [BPT](https://method.dbj.org/bpt/index.html) loop.'

  [params.terms]
    copyright = 'All rights reserved. Resilient ROI Ltd, London, UK.'
