baseURL = 'https://resilientroi.com/'
languageCode = 'en-gb'
title = 'Resilient ROI'
theme = 'hugo-profile'
copyright = '&copy; Resilient ROI Ltd. | Luton, UK'

[outputs]
  home = ['HTML', 'RSS', 'JSON']
  page = ['HTML', 'RSS']

[markup.goldmark.renderer]
  unsafe = true

[[menu.main]]
  name = 'Team'
  url = '/team/'
  weight = -1

[[menu.main]]
  name = 'DBJ Method'
  url = 'https://method.dbj.org/'
  weight = 1

[[menu.main]]
  name = 'Iceberg'
  url = 'https://iceberg.dbj.org/'
  weight = 3

[params]
  title = 'Resilient ROI'
  description = 'AI Aligned Production Systems'
  favicon = '/favicon/favicon.ico'
  useBootstrapCDN = false
  animate = true

  [params.color]
    textColor = '#E7ECF2'
    secondaryTextColor = '#8CA0B4'
    textLinkColor = '#E8A33D'
    backgroundColor = '#0F1620'
    secondaryBackgroundColor = '#141D2B'
    primaryColor = '#E8A33D'
    secondaryColor = '#141D2B'
    [params.color.darkmode]
      textColor = '#E7ECF2'
      secondaryTextColor = '#8CA0B4'
      textLinkColor = '#E8A33D'
      backgroundColor = '#0F1620'
      secondaryBackgroundColor = '#141D2B'
      primaryColor = '#E8A33D'
      secondaryColor = '#141D2B'

  [params.font]
    fontSize = '1rem'
    fontWeight = 400
    lineHeight = 1.5
    textAlign = 'left'

  [params.navbar]
    align = 'ms-auto'
    brandLogo = '/logo-rroi-64.png'
    brandName = 'Resilient ROI'
    disableSearch = true
    enableSeparator = false
    [params.navbar.stickyNavBar]
      enable = true
      showOnScrollUp = true
    [params.navbar.menus]
      disableAbout = true
      disableExperience = true
      disableEducation = true
      disableProjects = true
      disableAchievements = true
      disableContact = true

  [params.hero]
    enable = true
    intro = ' '
    title = 'Resilient ROI'
    subtitle = ''
    content = '''Organisation maturity must precede AI maturity.<br>[info@resilientroi.com](mailto:info@resilientroi.com?subject=Coming%20from%20a%20web%20site)'''
    image = '/lady_architect_whiteboard.png'
    [params.hero.button]
      enable = true
      name = 'What We Do'
      url = '#projects'
      newPage = false
    [params.hero.bottomImage]
      enable = false

  [params.projects]
    enable = true
    title = 'We Navigate'
    [[params.projects.items]]
      title = 'Knowledge'
      content = "Courses in the vocabulary, maturity model, decision wheel and operating loop behind the method. For organisations whose people need to understand the model before they run it."
      [params.projects.items.featured]
        name = 'See the courses'
        link = '/knowledge/'
    [[params.projects.items]]
      title = 'Hands-On Presence'
      content = "We work alongside your own teams to set up, run and monitor a BPT instance, or a Product Factory of several, on your premises, using our own BPTAPP tool."
      [params.projects.items.featured]
        name = 'See what we set up'
        link = '/hands-on/'
  [params.contact]
    enable = true
    title = 'Contact'
    content = 'AI does not wait. Write to us.'
    btnName = 'Email'
    btnLink = 'mailto:info@resilientroi.com'

  [params.footer]
    [params.footer.recentPosts]
      enable = false
      path = 'posts'
      count = 3
      title = 'Recent Posts'

  [params.about]
    enable = false
    title = 'We Navigate'
    content = """
The [DBJ Method](https://method.dbj.org/) is not the book of magic.

- **One shared vocabulary**: business, product and technology people speak one language. ([Taxonomy](https://method.dbj.org/taxonomy/index.html))
- **Business declares, technology implements**: Products teams is balancing the race. Business initiates ; technology never surprises. ([Operating model](https://method.dbj.org/bpt/bpt_operating_model.html))
- **Maturity is measured**: Achieved and maintained, before and after the delivery. ([Maturity model](https://method.dbj.org/cmm/index.html))
- **Every decision is recorded**: No ceremony. Short, repeatable cycles, and the reason for each decision. ([The wheel](https://method.dbj.org/adm/index.html))
- **Three quality factors**: Scalability, resilience and compliance. ([3QF](https://dbj.org/3qf-the-key-to-roi/))
- **Human-led**: Architecture decides the structure, flow and boundaries. AI speeds up the delivery.
"""
    [params.about.skills]
      enable = true
      content='With us, no project floats outside the [BPT](https://method.dbj.org/bpt/index.html) loop.'

  [params.terms]
    copyright = 'All rights reserved. Resilient ROI Ltd, UK.'
