{{ define "title" }}
{{ .Title }} | {{ .Site.Title }}
{{ end }}

{{ define "main" }}
<section id="team">
  <div class="container">
    <h1 class="text-center mb-5">{{ .Title }}</h1>
    <div class="row justify-content-center">
      {{ range .Params.members }}
      <div class="col-sm-12 col-md-6 text-center py-3">
        {{ if .image }}
        <img src="{{ .image }}" alt="{{ .name }}" class="img-thumbnail rounded-circle mb-3" width="160" height="160">
        {{ end }}
        <h3>{{ .name }}</h3>
        <h5 class="text-secondary">{{ .role }}</h5>
        {{ with .bio }}<p class="mt-2">{{ . }}</p>{{ end }}
      </div>
      {{ end }}
    </div>
  </div>
</section>
{{ end }}
